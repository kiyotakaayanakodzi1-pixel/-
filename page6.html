<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вопрос</title>
    <style>
        body {
            margin: 0; padding: 0;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #fff1eb 0%, #ace0f9 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        h1 {
            color: #333333;
            text-align: center;
            margin-bottom: 20px;
        }
        .btn-group {
            display: flex;
            gap: 20px;
        }
        .btn {
            padding: 15px 30px;
            background-color: #ffffff;
            color: #333333;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: none;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>
    <h1>Почему?</h1>
    <div class="btn-group">
        <button class="btn" onclick="nextPage('page7.html')">Не знаю</button>
        <button class="btn" onclick="nextPage('page8.html')">Хз</button>
    </div>
    <script>
        function nextPage(url) {
            window.location.href = url;
        }
    </script>
</body>
</html>
