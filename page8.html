<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Возврат</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #050508;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 20px;
            overflow: hidden;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(255, 180, 100, 0.5);
        }
        p {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 40px;
            max-width: 400px;
            line-height: 1.5;
        }
        .btn {
            padding: 15px 30px;
            background-color: #ffffff;
            color: #4b6cb7;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <h1>А, ну окей</h1>
    <p>Тогда вернись назад, чтобы получить свой подарок, выбрав ответ «Да» на предыдущем вопросе.</p>
    <a href="javascript:history.back()" class="btn">Назад</a>
</body>
</html>
