<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Чёрная дыра</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: #000;
    overflow: hidden; cursor: pointer;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; touch-action: none; }

  #final {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center; opacity: 0;
    pointer-events: none; transition: opacity 1.6s ease 0.6s;
    z-index: 10; padding: 24px;
    background: radial-gradient(circle at center, rgba(0,20,40,0.6), rgba(0,0,0,0.9));
  }
  #final.show { opacity: 1; pointer-events: auto; }

  .gift {
    font-size: clamp(36px, 9vw, 68px); font-weight: 800;
    letter-spacing: 4px; margin: 12px 0;
    background: linear-gradient(90deg, #d0f0ff, #a8d8ff, #ffb980, #ff8fb0);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 24px rgba(160, 210, 255, 0.7));
    opacity: 0; transform: translateY(30px) scale(0.85);
    transition: all 1.1s cubic-bezier(.2,.8,.3,1.2);
  }
  .gift.show { opacity: 1; transform: translateY(0) scale(1); }

  #message {
    margin-top: 30px; font-size: clamp(15px, 3.6vw, 19px);
    line-height: 1.7; max-width: 620px;
    opacity: 0; transform: translateY(20px);
    transition: all 1.3s ease; color: #eaf4ff;
  }
  #message.show { opacity: 1; transform: translateY(0); }

  #footer {
    position: absolute; bottom: 20px; left: 0; right: 0;
    text-align: center; font-size: 11px; letter-spacing: 2px;
    opacity: 0; color: #7a8595;
    transition: opacity 1.8s ease 2s;
  }
  #footer.show { opacity: 1; }
</style>
</head>
<body>

<canvas id="space"></canvas>

<div id="final">
  <div class="gift" id="gift1">🧸 Мишки 4X</div>
  <div class="gift" id="gift2">💖 Сердечко 4X</div>
  <div id="message">
    С Днём Рождения! 🎂<br>
    Пусть этот год принесёт тебе столько радости,<br>
    сколько света вокруг чёрной дыры ✨
  </div>
</div>

<div id="footer">🎁 Подарки будут в Telegram</div>

<script>
/* ============================================================
   ЧЁРНАЯ ДЫРА — по референсу из видео
   - Голубовато-белый турбулентный диск
   - Волокнистая структура (используем слои шума)
   - НЕ вращающиеся точки, а "вмороженные" в диск завихрения,
     которые пульсируют и перетекают
   - При удержании вся структура ускоряется и раскручивается
   - Взрыв → подарки
   ============================================================ */

const canvas = document.getElementById('space');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, DPR;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.width  = innerWidth  * DPR;
  H = canvas.height = innerHeight * DPR;
  canvas.style.width  = innerWidth  + 'px';
  canvas.style.height = innerHeight + 'px';
  cx = W / 2;
  cy = H / 2;
}
resize();
addEventListener('resize', resize);

/* ---------- Состояние ---------- */
let holding = false, charge = 0, exploded = false;
let explosionT = 0, flashAlpha = 0, shockwaves = [];
let showFinal = false;
let time = 0;

/* ---------- Звёздное небо (фон) ---------- */
const stars = [];
function initStars() {
  stars.length = 0;
  const n = 220;
  for (let i = 0; i < n; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      len: (0.5 + Math.random() * 3) * DPR,
      speed: 0.05 + Math.random() * 0.25,
      alpha: 0.15 + Math.random() * 0.5,
      angle: Math.random() * Math.PI * 2,
      life: Math.random(),
    });
  }
}
initStars();

/* ============================================================
   ВОЛОКНА ДИСКА
   Представь, что диск состоит из длинных "прядей" (нитей),
   каждая из которых закручена по спирали. Мы их рисуем как
   линии с большим количеством сегментов.
   Каждая нить:
     - имеет базовый угол φ
     - закручивается (спираль) на радиусе от R_in до R_out
     - пульсирует по яркости (мерцание)
     - вся структура вращается целиком; при удержании — быстрее
   ============================================================ */
const NUM_FILAMENTS = 180;
const filaments = [];

function initFilaments() {
  filaments.length = 0;
  for (let i = 0; i < NUM_FILAMENTS; i++) {
    filaments.push({
      // угловое смещение нити на разных радиусах (для турбулентности)
      spiral: 1.5 + Math.random() * 3.5,        // на сколько радиан закручена
      phase: Math.random() * Math.PI * 2,
      rIn: 0.35 + Math.random() * 0.35,          // доля от maxR
      rOut: 0.75 + Math.random() * 0.25,
      // турбулентное дрожание
      noiseSeed: Math.random() * 100,
      noiseAmp: 0.15 + Math.random() * 0.35,     // амплитуда колебаний яркости
      noiseSpeed: 0.5 + Math.random() * 2.0,
      // толщина нити
      width: 0.4 + Math.random() * 1.4,
      alpha: 0.25 + Math.random() * 0.55,
      // цветовой оттенок (белый → голубой)
      hue: 190 + Math.random() * 30,
      // небольшой личный сдвиг угла (чтобы нити не совпадали)
      baseAngle: Math.random() * Math.PI * 2,
    });
  }
}
initFilaments();

/* ---------- Шумовая функция (псевдо-Перлин) ---------- */
function noise(x, seed) {
  // быстрый хеш-шум, достаточный для мерцания
  const s = Math.sin(x * 12.9898 + seed * 78.233) * 43758.5453;
  return (s - Math.floor(s)) * 2 - 1; // [-1, 1]
}

/* ---------- Управление ---------- */
function startHold() {
  if (exploded || showFinal) return;
  holding = true;
}
function endHold() { holding = false; }

canvas.addEventListener('mousedown', startHold);
addEventListener('mouseup', endHold);
canvas.addEventListener('touchstart', e => { e.preventDefault(); startHold(); }, { passive: false });
addEventListener('touchend',   e => { e.preventDefault(); endHold(); },   { passive: false });
addEventListener('touchcancel', endHold);

/* ============================================================
   ОТРИСОВКА ДИСКА
   ============================================================ */
function drawDisk(dt) {
  const maxR = Math.min(W, H) * 0.42;          // радиус всего диска
  const Rhole = maxR * 0.22 * (1 + charge * 0.5); // радиус чёрной дыры
  // глобальный поворот структуры (замедляется/ускоряется)
  const globalAngle = time * (0.05 + charge * 1.2);

  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';

  for (const f of filaments) {
    // пульсация яркости нити
    const flicker = 0.6 + 0.4 * noise(time * f.noiseSpeed + f.noiseSeed, f.noiseSeed);
    const alpha = f.alpha * flicker * (0.85 + charge * 0.4);
    if (alpha < 0.02) continue;

    // радиусы нити с "дыханием" турбулентности
    const rIn  = Rhole * (1.02 + f.rIn  * 0.4);
    const rOut = Rhole + (maxR - Rhole) * f.rOut;

    const segments = 26;
    ctx.beginPath();
    for (let s = 0; s <= segments; s++) {
      const t = s / segments;
      // радиус вдоль нити
      let r = rIn + (rOut - rIn) * t;
      // спиральный угол: чем дальше, тем больше закрутка
      let ang = f.baseAngle + globalAngle
              + f.spiral * Math.pow(t, 1.4)
              + Math.sin(t * 6 + f.noiseSeed) * 0.12;
      // турбулентное радиальное дрожание
      r += noise(t * 4 + time * 0.7 + f.noiseSeed, f.noiseSeed) * f.noiseAmp * r * 0.06;

      // проецируем на плоскость диска (диск наклонён — сжимаем по Y)
      const tilt = 0.42;                       // насколько "раскрыт" диск
      const x = cx + Math.cos(ang) * r;
      const y = cy + Math.sin(ang) * r * tilt
              - r * 0.05 * Math.sin(ang);       // лёгкое поднятие задней части

      if (s === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    // градиент по нити: ярче у внутреннего края
    const grad = ctx.createRadialGradient(cx, cy, Rhole, cx, cy, maxR);
    const a0 = alpha * (1.1 + charge * 0.5);
    const a1 = alpha * 0.25;
    grad.addColorStop(0,    `hsla(${f.hue}, 100%, 95%, ${a0})`);
    grad.addColorStop(0.15, `hsla(${f.hue}, 95%, 85%, ${a0 * 0.9})`);
    grad.addColorStop(0.5,  `hsla(${f.hue}, 85%, 70%, ${a0 * 0.55})`);
    grad.addColorStop(1,    `hsla(${f.hue}, 80%, 55%, ${a1})`);
    ctx.strokeStyle = grad;
    ctx.lineWidth = f.width * DPR * (1 + charge * 0.5);
    ctx.stroke();
  }

  // Дополнительное голубое свечение вокруг всей структуры
  const glow = ctx.createRadialGradient(cx, cy, Rhole, cx, cy, maxR * 1.2);
  glow.addColorStop(0,   `rgba(180, 230, 255, ${0.06 + charge * 0.15})`);
  glow.addColorStop(0.4, `rgba(120, 180, 240, ${0.04 + charge * 0.08})`);
  glow.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, maxR * 1.2, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalCompositeOperation = 'source-over';
}

/* ---------- Чёрный центр ---------- */
function drawHole() {
  const maxR = Math.min(W, H) * 0.42;
  const R = maxR * 0.22 * (1 + charge * 0.5);

  // мягкая тёмная обводка вокруг
  const halo = ctx.createRadialGradient(cx, cy, R * 0.8, cx, cy, R * 1.6);
  halo.addColorStop(0, 'rgba(0,0,0,1)');
  halo.addColorStop(0.5, 'rgba(0,0,0,0.6)');
  halo.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(cx, cy, R * 1.6, 0, Math.PI * 2);
  ctx.fill();

  // чёрный круг
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.fillStyle = '#000';
  ctx.fill();
}

/* ---------- Звёзды на фоне ---------- */
function drawStars(dt) {
  ctx.globalCompositeOperation = 'lighter';
  for (const s of stars) {
    s.angle += 0.002 * dt;
    s.x += Math.cos(s.angle) * s.speed * dt;
    s.y += Math.sin(s.angle) * s.speed * dt;
    if (s.x < 0) s.x = W; if (s.x > W) s.x = 0;
    if (s.y < 0) s.y = H; if (s.y > H) s.y = 0;
    ctx.strokeStyle = `rgba(200, 220, 255, ${s.alpha * 0.7})`;
    ctx.lineWidth = 1 * DPR;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - Math.cos(s.angle) * s.len, s.y - Math.sin(s.angle) * s.len);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ---------- Взрыв ---------- */
function triggerExplosion() {
  exploded = true;
  explosionT = 0;
  flashAlpha = 1;
  shockwaves = [
    { r: 0, max: Math.max(W, H) * 0.95, w: 14 * DPR, hue: 195 },
    { r: 0, max: Math.max(W, H) * 0.75, w: 8  * DPR, hue: 210 },
    { r: 0, max: Math.max(W, H) * 1.15, w: 5  * DPR, hue: 320 },
  ];
}

function drawExplosion(dt) {
  if (!exploded) return;
  explosionT += dt;

  if (flashAlpha > 0) {
    ctx.fillStyle = `rgba(220, 240, 255, ${flashAlpha})`;
    ctx.fillRect(0, 0, W, H);
    flashAlpha *= 0.92;
    if (flashAlpha < 0.01) flashAlpha = 0;
  }

  for (const s of shockwaves) {
    if (s.r < s.max) {
      s.r += (s.max - s.r) * 0.055 + 2;
      ctx.beginPath();
      ctx.arc(cx, cy, s.r, 0, Math.PI * 2);
      ctx.strokeStyle = `hsla(${s.hue}, 100%, 80%, ${1 - s.r / s.max})`;
      ctx.lineWidth = s.w * (1 - s.r / s.max);
      ctx.shadowColor = `hsla(${s.hue}, 100%, 75%, 1)`;
      ctx.shadowBlur = 25 * DPR;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }
}

/* ============================================================
   ГЛАВНЫЙ ЦИКЛ
   ============================================================ */
let lastT = performance.now();

function loop(now) {
  const dt = Math.min((now - lastT) / 16.67, 3);
  lastT = now;
  time += dt * 0.016;

  // чёрный фон (без следов, чтобы не было размазывания)
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  drawStars(dt);

  if (holding && !exploded) {
    charge = Math.min(1, charge + 0.009 * dt);
    if (charge >= 1) triggerExplosion();
  } else if (!exploded) {
    charge *= 0.97;
  }

  if (!exploded) {
    drawDisk(dt);
    drawHole();
  } else {
    drawExplosion(dt);
  }

  if (exploded && !showFinal && explosionT > 65) {
    showFinal = true;
    revealFinal();
  }

  requestAnimationFrame(loop);
}

function revealFinal() {
  document.getElementById('final').classList.add('show');
  setTimeout(() => document.getElementById('gift1').classList.add('show'), 500);
  setTimeout(() => document.getElementById('gift2').classList.add('show'), 1400);
  setTimeout(() => document.getElementById('message').classList.add('show'), 2500);
  setTimeout(() => document.getElementById('footer').classList.add('show'), 3600);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
